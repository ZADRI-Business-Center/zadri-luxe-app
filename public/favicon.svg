<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradient de fond : Noir émeraude luxueux -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08100C"/>
      <stop offset="45%" stop-color="#0E2117"/>
      <stop offset="100%" stop-color="#17824F"/>
    </linearGradient>

    <!-- Gradient or pour le monogramme -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE6A3"/>
      <stop offset="25%" stop-color="#E0982E"/>
      <stop offset="60%" stop-color="#F7C96B"/>
      <stop offset="100%" stop-color="#C57E1E"/>
    </linearGradient>

    <!-- Bordure fine dorée -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0982E" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#17824F" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E0982E" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Filtre ombre douce -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#E0982E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fond squircle moderne -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="6"/>

  <!-- Losange décoratif supérieur et inférieur -->
  <polygon points="256,76 264,88 256,100 248,88" fill="url(#goldGrad)" opacity="0.9"/>
  <polygon points="256,412 264,424 256,436 248,424" fill="url(#goldGrad)" opacity="0.9"/>

  <!-- Monogramme Z Stylisé Luxe avec empattements géométriques -->
  <g filter="url(#goldGlow)">
    <path d="M140 160 C140 148, 150 140, 164 140 L350 140 C364 140, 372 152, 366 164 L220 332 L354 332 C366 332, 372 342, 372 352 L372 358 C372 368, 364 372, 350 372 L158 372 C144 372, 136 360, 142 348 L290 180 L158 180 C146 180, 140 172, 140 160 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Étoile étincelle bijou en haut à droite -->
  <path d="M374 120 Q374 136 390 136 Q374 136 374 152 Q374 136 358 136 Q374 136 374 120 Z" fill="#FFF2BD"/>
</svg>
